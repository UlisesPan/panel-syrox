services:
  - type: web
    name: panel-syrox-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @panel/shared build && pnpm --filter api build && pnpm --filter api db:deploy
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: PORT
        value: "4000"
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: JWT_REMEMBER_EXPIRES_IN
        value: "30d"
      - key: APP_URL
        value: https://panel-syrox.vercel.app
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Tennis Star
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
